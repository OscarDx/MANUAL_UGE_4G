
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Manual</title>

	<script>
		
		const tiempo = sessionStorage.getItem("ok"); //Si no se ha validado tiempo=NULL y si SÍ pues la hora en la que se validó (en ms)

		//Si NO has validado sesión te echa al login, le dice al navegador que abra esa direccion
		if (!tiempo) {
		  window.location.href = "index.html";
		} 
		else {
		  const actual = Date.now();
		  const restante = 60000 - (actual - tiempo); // Tenemos el tiempo que queda de la sesión (1 minuto)

		  // Si ya está caducado porque pasó el tiempo
		  if (restante <= 0) {
			sessionStorage.removeItem("ok"); //Se borra el acceso
			window.location.href = "index.html"; //Te echa al login
		  } 
		  else {
			//setTimeout(funcion,tiempo)
			// Si aún es válido porque queda tiempo puedes verlo, pero ejecuta lo mismo que antes dentro de X tiempo (restante)			
			setTimeout(() => {

			  document.getElementById("mensaje").style.display = "block";
			  setTimeout(() => {
				sessionStorage.removeItem("ok"); window.location.href = "index.html";}, 5000); // espera 2 segundos antes de salir

			}, restante);
		  }
		}

	</script>

	<style>
		body {
		  margin: 0;
		}

		embed {
		  width: 100%;
		  height: 100vh;
		}
	</style>

</head>

<body>
	
	<div id="mensaje" 
	 style="
	  position: fixed;
	  top: 0;
	  left: 0;
	  width: 100%;
	  background: red;
	  color: white;
	  text-align: center;
	  padding: 10px;
	  display: none;
	  z-index: 1000;
	 ">
	  La sesión ha expirado
	</div>

	<!-- embed: Mostrar el pdf dentro de la pagina -->
	<embed src="Manual_UGE_4G_v01_24.pdf"> 

</body>
</html>
