<!DOCTYPE html> <!-- para indicar al navegador que es una pagina web -->
<html lang="es">
<head> <!-- "lo que no se ve" -->
	<meta charset="UTF-8"> <!-- charset evita errores con tildes y demás -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
	<title>UGE 4G - Acceso Manual</title> <!-- título de la pestaña -->
	  
	<style> /* diseño en cuanto a colores, tamaños... */
		body {
		  margin: 0;
		  font-family: Arial, sans-serif;
		  background: linear-gradient(to right, #1f2490, #2E2FA2);
		  color: white;
		  display: flex;
		  justify-content: center;
		  /*  align-items: center; */
		  align-items: flex-start;
		  /* height: 100vh; */	  
		  min-height: 100vh;
		  padding-top: 40px;
		}

		.container { /* bloque de estilo1 */
		  background: #ffffff10;
		  backdrop-filter: blur(10px);
		  padding: 40px;
		  border-radius: 15px;
		  text-align: center;
		  /*width: 300px;*/ 
		  width: 90%;
          max-width: 400px;
		  box-shadow: 0 0 20px rgba(0,0,0,0.5);
		}
		
		.logo {
		  width: 150px;
		  margin-bottom: 15px;
		}

		h2 {
		  font-size: 24px;
		  font-weight: normal;
		  color: #cccccc;
		  margin-bottom: 2px;
		}
		
		h3 {
		  font-size: 35px;
		  font-weight: bold;
		  letter-spacing: 2px;
		  color: #B7D300;
		  margin-bottom: 30px;
		}		
		
		.texto-ayuda {
		  font-size: 16px;
		  color: #ffffff;
		  margin-top: 15px;
		  line-height: 1.4;
		}

		input {
		  width: 100%;
		  box-sizing: border-box;
		  padding: 12px;
		  margin-top: 20px;
		  border: none;
		  border-radius: 8px;
		  font-size: 18px;
		}

		button {
		  width: 100%;
		  box-sizing: border-box;
		  padding: 14px;
		  margin-top: 15px;
		  border: none;
		  border-radius: 8px;
		  background-color: #B7D300;
		  color: #1f2490;
		  font-size: 18px;
		  cursor: pointer;
		  font-weight: bold;
		}

		button:hover {
		  background-color: #9fb800;
		}
		
		button:active { /*animacion al pinchar*/
		  transform: scale(0.98);
		}

		.footer { /* bloque de estilo2 */
		  margin-top: 20px;
		  font-size: 12px;
		  color: #aaa;
		}
		 
	</style>
  
</head>

<body> <!--  "lo que se ve" -->
	
	
  <div class="container">
  
	<!--<img src="Logo_Duplex_sinfondo.png" alt="Logo DUPLEX" class="logo"> No queda del todo bien el logo-->
  
	<h2>Equipo de Gestión de Emergencias</h2>
	<h3>UGE 4G</h3>

	<p class="texto-ayuda">
	Introduce tus Credenciales y pulsa "Acceder"
	</p>

	<input type="text" id="operario" placeholder="Ej: 135FR" inputmode="text"> 
	<!--text permite introducir texto libre, se podria pensar en ser mas estricto-->
	<!--inputmode numeric o text, activa el teclado numero automaticamente o el completo -->

	<button onclick="validar()">Acceder</button> <!-- cuando se hace click, ejecuta la funcion validar -->
	
	<p id="error" style="color:#ff2b2b; margin-top:10px; font-weight:bold; display:none;"> <!-- display:none oculta el mensaje al inicio -->
	Número de Operario incorrecto
	</p>
	
	<!--No me convence que salga esto lo dejo quitado
	<div class="footer">
      Acceso restringido
	</div>
	-->
  </div>

	<script>
	
	function validar() {

	 const operarios_validos = [ 
		
		"610SG","1938SF","1910NT","1635LD","732MH","731PA" <!--ALMERIA-->

	]; 

	 
	 
	 <!-- const operarios_validos = [  -->
	 <!--	"nnunez885","jruperez819","omoreno808","0020"  -->
	 <!-- ];  -->
 
	 var operario = document.getElementById("operario").value;
	  
	 if (operarios_validos.includes(operario)) { <!-- si el operario introducido esta en la lista
	 
		<!-- guarda el permiso para un Operario validado. En vez guardar un 1, guarda la hora en milisegundos. 
		sessionStorage.setItem("ok", Date.now()); <!--  Entonces tendremos "ok" = 17160001-->
		<!-- guarda el numero de operario en otra variable para poder mostrarlo en el visor -->
		sessionStorage.setItem("operario", operario); <!--  -->
		
		<!--Cambia de pagina, enlace para ir a otra página. -->
		<!--Siempre llegas al login, no ves el pdf directamentede y la direccion vista sera https://...../visor.html -->
		window.location.href = "visor.html";
	 }
	 
	 else {
		document.getElementById("error").style.display = "block";
	 }

	}
	</script>


</body>
</html>
