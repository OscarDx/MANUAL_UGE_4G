	<style> /* diseño en cuanto a colores, tamaños... */
		body {
		  margin: 0;
		  font-family: Arial, sans-serif;
		  background: linear-gradient(to right, #1f2490, #2E2FA2);
		  color: white;
		  display: flex;
		  justify-content: center;
		  /*  align-items: center; */
		  align-items: flex-start;
		  /* height: 100vh; */	  
		  min-height: 100vh;
		  padding-top: 40px;
		}

		.container { /* bloque de estilo1 */
		  background: #ffffff10;
		  backdrop-filter: blur(10px);
		  padding: 40px;
		  border-radius: 15px;
		  text-align: center;
		  /*width: 300px;*/ 
		  width: 90%;
          max-width: 400px;

		}
		
		.logo {
		  width: 150px;
		  margin-bottom: 15px;
		}

		h2 {
		  font-size: 24px;
		  font-weight: normal;
		  color: #cccccc;
		  margin-bottom: 2px;
		}
		
		h3 {
		  font-size: 35px;
		  font-weight: bold;
		  letter-spacing: 2px;
		  color: #B7D300;
		  margin-bottom: 30px;
		}		
		
		.texto-ayuda {
		  font-size: 16px;
		  color: #ffffff;
		  margin-top: 15px;
		  line-height: 1.4;
		}

		input {
		  width: 100%;
		  box-sizing: border-box;
		  padding: 12px;
		  margin-top: 20px;
		  border: none;
		  border-radius: 8px;
		  font-size: 18px;
		}

		button {
		  width: 100%;
		  box-sizing: border-box;
		  padding: 14px;
		  margin-top: 15px;
		  border: none;
		  border-radius: 8px;
		  background-color: #B7D300;
		  color: #1f2490;
		  font-size: 18px;
		  cursor: pointer;
		  font-weight: bold;
		}

		button:hover {
		  background-color: #9fb800;
		}
		
		button:active { <!--animacion al pinchar-->
		  transform: scale(0.98);
		}


		.footer { /* bloque de estilo2 */
		  margin-top: 20px;
		  font-size: 12px;
		  color: #aaa;
		}
		 
		iframe {
		  border: none;
		  width: 100%;
		  height: 80vh;
		}

	</style>
  
</head>
